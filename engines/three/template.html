<title>3D Reel</title>

<main>
<div id="stage"><div id="view"><button id="fsx" title="Exit full screen">✕</button><div id="guides"><b style="top:15.6%;height:18.2%"></b><i style="top:65.1%"></i></div><div id="badge"></div></div></div>
<aside>
<div><h1 id="title">3D Reel</h1><p>1080×1920 · Three.js</p></div>
<div class="card"><div class="row"><button id="play">▶ Play</button><button id="restart">⟲</button><button id="fs">⛶ Full screen</button><span id="time">0.0 / 0.0</span></div>
<input id="scrub" type="range" min="0" max="10" step="0.001" value="0" style="margin-top:10px" /><p>Space play/pause · ←/→ one frame (Shift: one second) · F full screen</p></div>
<div class="card"><div class="row"><button id="prevChk">◀</button><button id="nextChk" style="flex:1">📸 Next check frame</button></div>
<label style="margin-top:8px"><input id="guidesOn" type="checkbox" checked /> Guides: caption band, and the line below which Reels covers the picture</label>
<p id="chkInfo" style="margin-top:6px;color:#d7dbe4">Each press pauses on a frame to check. Screenshot the picture each time, then attach the screenshots in the chat.</p></div>
<div class="card"><div class="row"><label>End screen hold (s) <input id="hold" type="number" min="0" max="60" step="0.5" /></label><label><input id="hear" type="checkbox" checked /> Hear sound</label></div>
<label style="margin-top:8px">Volume <input id="vol" type="range" min="0" max="1" step="0.01" /></label></div>
<div class="card"><button id="rec">● Record &amp; Download</button><p id="status" style="margin-top:8px"></p></div>
</aside>
</main>
