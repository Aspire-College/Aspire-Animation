<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel Studio</title>
<!-- Tailwind: styles the UI around the canvas only -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- Fonts drawn ON the canvas (captions + scene text). Keep in sync with STYLE.font / REEL.extraFonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!--@@FONTS@@-->
<!-- Fonts: build.py writes one <link> per "// @fonts" family in reel.js (default Poppins 800) -->
<!-- p5.js, pinned to 1.x (2.x changed several drawing APIs) -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script>window.p5 || document.write('<script src="https://unpkg.com/p5@1.11.10/lib/p5.min.js"><\/script>');</script>
<style>
  #stage canvas { display: block; }
  input[type=range] { accent-color: #ef4444; }
  #stage.fs { position: fixed; inset: 0; z-index: 50; border-radius: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #fsx { display: none; position: absolute; top: 14px; right: 14px; z-index: 60; width: 44px; height: 44px; border-radius: 50%; background: #000a; color: #fff; font-size: 20px; }
  #stage.fs #fsx { display: block; }
</style>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-200 antialiased">
<main class="mx-auto flex max-w-6xl flex-col items-center gap-6 px-4 py-6 lg:flex-row lg:items-start lg:justify-center lg:gap-10 lg:py-8">

  <section class="lg:sticky lg:top-8">
    <div id="stage" class="relative overflow-hidden rounded-2xl bg-black shadow-2xl shadow-black/60 ring-1 ring-white/10">
      <button id="fsx" title="Exit full screen (Esc)">✕</button>
      <!-- Approximate Instagram Reels overlay. HTML only, so it is never recorded. -->
      <div id="guides" class="pointer-events-none absolute inset-0 z-10 hidden">
        <div class="absolute inset-x-0 top-0 flex h-[14%] items-end justify-center bg-red-500/25 pb-1 text-[10px] font-semibold uppercase tracking-widest text-white ring-1 ring-inset ring-red-400/70">Top bar</div>
        <div class="absolute inset-x-0 bottom-0 flex h-[35%] items-start justify-center bg-red-500/25 pt-1 text-[10px] font-semibold uppercase tracking-widest text-white ring-1 ring-inset ring-red-400/70">Caption · username · audio</div>
        <div class="absolute right-0 top-[52%] h-[13%] w-[13%] bg-red-500/25 ring-1 ring-inset ring-red-400/70"></div>
        <div class="absolute inset-y-0 left-0 w-[6%] bg-red-500/10"></div>
        <div class="absolute inset-y-0 right-0 w-[6%] bg-red-500/10"></div>
      </div>
    </div>
    <p class="mt-2 text-center text-xs text-neutral-500">1080 × 1920 · <span id="fpsLabel">30</span> fps · preview is scaled</p>
  </section>

  <aside class="w-full max-w-md space-y-4">
    <header>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-red-400">Reel studio</p>
      <h1 id="title" class="mt-1 text-2xl font-bold text-white">Reel</h1>
    </header>

    <div class="rounded-xl bg-neutral-900 p-4 ring-1 ring-white/10">
      <div class="flex items-center gap-2">
        <button id="btnPlay" class="inline-flex w-24 items-center justify-center gap-2 rounded-lg bg-white px-3 py-2 text-sm font-semibold text-neutral-900 hover:bg-neutral-200 disabled:opacity-50">▶ Play</button>
        <button id="btnRestart" class="rounded-lg bg-white/10 px-3 py-2 text-sm font-medium text-white hover:bg-white/15 disabled:opacity-50">⟲ Restart</button>
        <button id="btnFull" title="Full screen (F)" class="rounded-lg bg-white/10 px-3 py-2 text-sm font-medium text-white hover:bg-white/15">⛶</button>
        <button id="btnShot" title="Copy this frame as a 1080×1920 PNG (S)" class="rounded-lg bg-white/10 px-3 py-2 text-sm font-medium text-white hover:bg-white/15 disabled:opacity-50">📷</button>
        <span id="time" class="ml-auto font-mono text-sm tabular-nums text-neutral-400">0:00.0 / 0:00.0</span>
      </div>
      <input id="scrub" type="range" min="0" max="10" step="0.001" value="0" class="mt-3 w-full disabled:opacity-50" />
      <p class="mt-1 text-[11px] text-neutral-500">Space play/pause · ←/→ one frame · Shift+←/→ one second · F full screen · S screenshot</p>
    </div>

    <div class="grid grid-cols-2 gap-3 rounded-xl bg-neutral-900 p-4 ring-1 ring-white/10">
      <label class="text-xs text-neutral-400">Total length (s)
        <span class="mt-1 flex gap-1">
          <input id="len" type="number" min="1" max="180" step="0.1" class="w-full rounded-md bg-neutral-800 px-2 py-1.5 text-sm text-white ring-1 ring-white/10 focus:outline-none focus:ring-red-400 disabled:opacity-50" />
          <button id="lenReset" title="Reset to the script's length" class="rounded-md bg-neutral-800 px-2 text-sm text-neutral-300 ring-1 ring-white/10 hover:text-white disabled:opacity-50">↺</button>
        </span>
      </label>
      <label class="text-xs text-neutral-400">Timing
        <select id="timing" class="mt-1 w-full rounded-md bg-neutral-800 px-2 py-1.5 text-sm text-white ring-1 ring-white/10 focus:outline-none focus:ring-red-400 disabled:opacity-50">
          <option value="keep">Keep timestamps</option>
          <option value="stretch">Stretch to length</option>
        </select>
      </label>
      <label class="col-span-2 text-xs text-neutral-400">End screen hold (s)
        <input id="hold" type="number" min="0" max="120" step="0.5" class="mt-1 w-full rounded-md bg-neutral-800 px-2 py-1.5 text-sm text-white ring-1 ring-white/10 focus:outline-none focus:ring-red-400 disabled:opacity-50" />
      </label>
      <label class="col-span-2 text-xs text-neutral-400">SFX volume <span id="volLabel" class="text-neutral-300">80%</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" class="mt-1 w-full disabled:opacity-50" />
      </label>
      <label class="flex items-center gap-2 text-sm text-neutral-300"><input id="monitor" type="checkbox" checked class="accent-red-500" /> Hear SFX</label>
      <label class="flex items-center gap-2 text-sm text-neutral-300"><input id="guidesToggle" type="checkbox" class="accent-red-500" /> Reels UI guides</label>
      <p id="timingNote" class="col-span-2 text-[11px] leading-snug text-neutral-500"></p>
    </div>

    <div class="rounded-xl bg-neutral-900 p-4 ring-1 ring-white/10">
      <button id="btnRec" class="flex w-full items-center justify-center gap-2 rounded-lg bg-red-600 px-4 py-3 font-semibold text-white hover:bg-red-500 disabled:cursor-not-allowed disabled:opacity-70">
        <span class="h-2.5 w-2.5 rounded-full bg-white"></span><span id="recLabel">Record &amp; Download</span>
      </button>
      <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-neutral-800"><div id="recBar" class="h-full w-0 bg-red-500"></div></div>
      <div class="mt-2 flex items-start gap-2">
        <p id="status" class="flex-1 text-xs leading-snug text-neutral-400"></p>
        <button id="btnCancel" class="hidden rounded-md bg-white/10 px-2 py-1 text-xs text-white hover:bg-white/15">Cancel</button>
      </div>
      <a id="again" class="mt-2 hidden text-xs text-red-300 underline underline-offset-2"></a>
    </div>

    <div class="rounded-xl bg-neutral-900 p-2 ring-1 ring-white/10">
      <p class="px-2 pb-1 pt-2 text-xs font-semibold uppercase tracking-widest text-neutral-500">Script</p>
      <ol id="lines" class="max-h-80 space-y-1 overflow-y-auto"></ol>
    </div>
  </aside>
</main>

<!--@@IMAGES@@-->
<script id="reel">
/*@@REEL@@*/

// ════════════════════════════════════════════════════════════════════
//  ENGINE — timeline, captions, transitions, SFX, recording, UI.
//  Usually no need to edit below this line.
// ════════════════════════════════════════════════════════════════════
const W = 1080, H = 1920;
for (const [k, v] of Object.entries({ title: 'Reel', fps: 30, length: null, timing: 'keep', sfxVolume: 0.8, autoTransitionSfx: false, videoBitrate: 12_000_000, locale: 'en-IN', extraFonts: [], ctaHold: 0 })) if (REEL[k] === undefined) REEL[k] = v;
// Meta's Reels guidance: keep text and logos out of the top 14%, bottom 35% and 6% on each side.
const SAFE = { top: 270, bottom: 1250, left: 65, right: 1015 };

// ── Motion helpers ───────────────────────────────────────────────────
const Ease = {
  linear: x => x,
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inOutQuad: x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuart: x => 1 - Math.pow(1 - x, 4),
  inExpo: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  outExpo: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutExpo: x => x === 0 ? 0 : x === 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  inBack: x => 2.70158 * x * x * x - 1.70158 * x * x,
  outBack: x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2),
  outElastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1,
  outBounce: x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
};
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const mix = (a, b, k) => a + (b - a) * k;
/** 0→1 progress of a tween that starts at `start` and lasts `dur` (seconds). */
function tw(t, start, dur, ease = Ease.outCubic) { return ease(clamp01((t - start) / dur)); }
/** 0→1→0 bump that peaks halfway through [at, at+dur]. */
function bump(t, at, dur) { const k = (t - at) / dur; return k <= 0 || k >= 1 ? 0 : Math.sin(k * Math.PI); }
/** Seeded random generator: same seed → same sequence every frame. */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/** Time quantised to STYLE.boil steps per second, for a hand-drawn "boil". */
function boilT(t) { return STYLE.boil > 0 ? Math.floor(t * STYLE.boil) / STYLE.boil : t; }
/** Deterministic wobble in [-amt, amt] that changes at the boil rate. */
function wob(seed, t, amt = 4) { return (noise(seed * 13.17 + 0.5, boilT(t) * 3.7) - 0.5) * 2 * amt; }
/** Draw a polyline [[x,y],…] up to fraction u of its length (draw-on effect). Set stroke/noFill first. */
function drawPath(pts, u = 1) {
  if (u <= 0 || pts.length < 2) return;
  const seg = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
  let left = total * clamp01(u);
  beginShape(); vertex(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const l = seg[i - 1];
    if (l <= left) { vertex(pts[i][0], pts[i][1]); left -= l; }
    else { const k = left / l; vertex(mix(pts[i - 1][0], pts[i][0], k), mix(pts[i - 1][1], pts[i][1], k)); left = 0; }
  }
  endShape();
}
function withAlpha(c, a) { const col = color(c); col.setAlpha(255 * a); return col; }
/** Paint an offscreen layer once and reuse it every frame (static backgrounds, textures, halftone screens).
 *  paint(g) draws with g.fill(), g.rect()… and must use rng(), not Math.random(). Use: image(layer('sky', W, H, g => …), 0, 0) */
const _layers = new Map();
function layer(key, w, h, paint) { let g = _layers.get(key); if (!g) { g = createGraphics(w, h); g.pixelDensity(1); paint(g); _layers.set(key, g); } return g; }
function dropShadow(blur = 30, col = 'rgba(0,0,0,0.25)', ox = 0, oy = 12) { const c = drawingContext; c.shadowBlur = blur; c.shadowColor = col; c.shadowOffsetX = ox; c.shadowOffsetY = oy; }
function noShadow() { const c = drawingContext; c.shadowBlur = 0; c.shadowColor = 'transparent'; c.shadowOffsetX = 0; c.shadowOffsetY = 0; }

// ── Timeline ─────────────────────────────────────────────────────────
const TRANSITION_SFX = { wipe: 'whoosh', iris: 'whoosh', blinds: 'whoosh', flash: null };
const TRANS_D = 0.2;
const UI = { len: null, timing: REEL.timing, vol: REEL.sfxVolume, monitor: true, hold: REEL.ctaHold || 0 };
let TL = null;

function scriptEnd() { return Math.max(...SCRIPT.map(e => e.end)); }

function buildTimeline() {
  const end = scriptEnd(), hold = Math.max(0, UI.hold || 0);
  const len = Math.max(0.5, UI.len || REEL.length || end + hold);
  const k = UI.timing === 'stretch' ? Math.max(0.2, len - hold) / end : 1;   // stretch scales the script; the hold comes after it
  const lines = SCRIPT.map((e, i) => ({ ...e, i, t0: e.start * k, t1: e.hold ? len : Math.min(e.end * k, len) }))
    .filter(l => l.t0 < len).sort((a, b) => a.t0 - b.t0);
  lines.forEach((l, j) => { l.v0 = j === 0 ? 0 : l.t0; l.v1 = j < lines.length - 1 ? lines[j + 1].t0 : len; });
  const cues = [];
  for (const l of lines) {
    const tr = l.transition || 'cut', auto = TRANSITION_SFX[tr];
    if (REEL.autoTransitionSfx && auto && l.v0 > 0 && !(l.sfx || []).some(c => c.at <= 0.05)) cues.push({ type: auto, time: l.v0 - 0.18, dur: 0.4, vol: 0.55 });
    for (const c of l.sfx || []) { const time = c.fromEnd != null ? len - c.fromEnd : l.t0 + c.at * k; if (time >= 0 && time < len) cues.push(c.toEnd ? { ...c, time, dur: Math.max(0.3, len - time) } : { ...c, time }); }
  }
  cues.sort((a, b) => a.time - b.time);
  const caps = [];
  for (const l of lines) { const own = chunkCaption(l.text, l.t0, l.hold ? Math.min(l.end * k, len) : l.t1); if (l.hold && own.length) own[own.length - 1].t1 = len + 1; caps.push(...own); }
  TL = { len, k, lines, cues, caps };
}

function sceneAt(T) { let cur = null; for (const l of TL.lines) { if (l.v0 <= T) cur = l; else break; } return cur; }

// ── Captions (line by line; long lines split into readable chunks) ──
function tokenize(text) {
  const out = []; let em = false;
  for (const part of String(text).split(/(\*)/)) { if (part === '*') { em = !em; continue; } for (const w of part.split(/\s+/)) if (w) out.push({ w, em }); }
  return out;
}
function chunkCaption(text, t0, t1) {
  const toks = tokenize(text); if (!toks.length || t1 <= t0) return [];
  const max = CAPTIONS.maxWords; let groups = [toks];
  if (max > 0 && toks.length > Math.ceil(max * 1.25)) {
    groups = []; let cur = [];
    toks.forEach((tk, i) => {
      cur.push(tk);
      const left = toks.length - i - 1, punct = /[,.;:!?—–]$/.test(tk.w);
      if (left > 1 && (cur.length >= max || (punct && cur.length >= Math.ceil(max * 0.5)))) { groups.push(cur); cur = []; }
    });
    if (cur.length) groups.push(cur);
    if (groups.length > 1 && groups[groups.length - 1].length < 3) { const last = groups.pop(); groups[groups.length - 1].push(...last); }
  }
  const weight = g => g.reduce((s, tk) => s + tk.w.length + 1, 0) + 3;
  const total = groups.reduce((s, g) => s + weight(g), 0);
  let t = t0;
  return groups.map(g => { const d = (t1 - t0) * weight(g) / total; const c = { t0: t, t1: t + d, toks: g, lay: null }; t += d; return c; });
}
function wrapWords(toks, maxW, sp) {
  const lines = []; let cur = { words: [], w: 0 };
  for (const tk of toks) {
    const ww = textWidth(tk.w), nw = cur.words.length ? cur.w + sp + ww : ww;
    if (cur.words.length && nw > maxW) { lines.push(cur); cur = { words: [{ ...tk, ww }], w: ww }; }
    else { cur.words.push({ ...tk, ww }); cur.w = nw; }
  }
  lines.push(cur); return lines;
}
function layoutCaption(c) {
  if (c.lay) return c.lay;
  push(); textFont(STYLE.font); textStyle(BOLD);
  let size = CAPTIONS.size, lines = [], sp = 0;
  for (; size >= 40; size -= 4) {
    textSize(size); sp = textWidth(' ');
    lines = wrapWords(c.toks, CAPTIONS.maxWidth, sp);
    if (lines.length <= CAPTIONS.maxLines) break;
  }
  if (lines.length > 1) { // balance: narrowest width that keeps the same line count, so no word is left alone
    let lo = CAPTIONS.maxWidth * 0.4, hi = CAPTIONS.maxWidth;
    for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2; if (wrapWords(c.toks, mid, sp).length <= lines.length) hi = mid; else lo = mid; }
    lines = wrapWords(c.toks, hi, sp);
    if (lines.length === 2) { // prefer breaking after punctuation when both halves still fit
      const widest = Math.max(...lines.map(l => l.w)); let best = null;
      c.toks.forEach((tk, i) => {
        if (i >= c.toks.length - 1 || !/[,.;:!?—–]$/.test(tk.w)) return;
        const a = wrapWords(c.toks.slice(0, i + 1), 1e9, sp)[0], b = wrapWords(c.toks.slice(i + 1), 1e9, sp)[0], m = Math.max(a.w, b.w);
        if (m <= CAPTIONS.maxWidth && m <= widest * 1.4 && (!best || m < best.m)) best = { m, lines: [a, b] };
      });
      if (best) lines = best.lines;
    }
  }
  pop();
  return (c.lay = { size, lines, sp });
}
function drawCaption(T) {
  const c = TL.caps.find(c => T >= c.t0 && T < c.t1); if (!c) return;
  const L = layoutCaption(c), lh = L.size * 1.3, blockH = L.lines.length * lh;
  const cy = Math.max(SAFE.top + blockH / 2 + 10, Math.min(CAPTIONS.y * H, SAFE.bottom - blockH / 2 - 10));
  const age = T - c.t0, first = c.t0 <= 0.001; // the opening caption is fully visible on frame 0 (the cover)
  const kIn = first ? 1 : Ease.outBack(clamp01(age / 0.22));
  const a = Math.min(first ? 1 : clamp01(age / 0.08), clamp01((c.t1 - T) / 0.1));
  push();
  drawingContext.globalAlpha = a;
  translate(W / 2, cy + (1 - kIn) * 30); scale(0.92 + 0.08 * kIn);
  textFont(STYLE.font); textStyle(BOLD); textSize(L.size); textAlign(LEFT, CENTER);
  L.lines.forEach((ln, j) => {
    const y = -blockH / 2 + lh * (j + 0.5);
    if (CAPTIONS.box) { noStroke(); fill(CAPTIONS.box); rect(-ln.w / 2 - CAPTIONS.padX, y - lh / 2 + 5, ln.w + CAPTIONS.padX * 2, lh - 10, CAPTIONS.radius); }
    let x = -ln.w / 2;
    for (const wd of ln.words) {
      if (CAPTIONS.outline > 0) { noFill(); stroke(CAPTIONS.outlineColor); strokeWeight(CAPTIONS.outline * 2); strokeJoin(ROUND); text(wd.w, x, y + L.size * 0.06); }
      noStroke(); fill(wd.em ? CAPTIONS.emphasis : CAPTIONS.color); text(wd.w, x, y + L.size * 0.06);
      x += wd.ww + L.sp;
    }
  });
  pop();
}

// ── Transitions (drawn over the cut, so only one scene renders per frame) ─
const TRANSITIONS = {
  flash(cover, phaseIn) { if (phaseIn) return; noStroke(); fill(255, 255 * cover); rect(0, 0, W, H); },
  wipe(cover, phaseIn) {
    const slant = 320; noStroke();
    const panel = (x, col) => { fill(col); if (phaseIn) quad(-20, 0, x + slant, 0, x, H, -20, H); else quad(x + slant, 0, W + 20, 0, W + 20, H, x, H); };
    const x = phaseIn ? mix(-slant, W, cover) : mix(W, -slant, cover);
    panel(phaseIn ? x + 40 : x - 40, STYLE.accent);
    panel(x, STYLE.ink);
  },
  iris(cover) {
    const c = drawingContext, cx = W / 2, cy = H * 0.52, R = Math.hypot(W / 2, Math.max(cy, H - cy)) + 10;
    c.save(); c.fillStyle = STYLE.ink; c.beginPath(); c.rect(0, 0, W, H); c.arc(cx, cy, Math.max(0.01, R * (1 - cover)), 0, Math.PI * 2); c.fill('evenodd'); c.restore();
  },
  blinds(cover, phaseIn) {
    const n = 7, bh = H / n, st = 0.6; noStroke();
    for (let i = 0; i < n; i++) {
      const order = phaseIn ? i : n - 1 - i, k = clamp01(cover * (1 + st) - st * order / (n - 1));
      if (k <= 0) continue;
      fill(STYLE.palette[i % STYLE.palette.length]);
      if (phaseIn) rect(0, i * bh, W, bh * k + 1); else rect(0, (i + 1) * bh - bh * k, W, bh * k + 1);
    }
  },
};
function drawTransition(T) {
  for (const l of TL.lines) {
    const tr = l.transition || 'cut'; if (tr === 'cut' || l.v0 === 0) continue;
    const dt = T - l.v0; if (dt < -TRANS_D || dt > TRANS_D) continue;
    const cover = dt < 0 ? Ease.inCubic(1 + dt / TRANS_D) : Ease.inCubic(1 - dt / TRANS_D);
    if (TRANSITIONS[tr]) TRANSITIONS[tr](cover, dt < 0, l);
  }
}

// ── Camera shake from cues with `shake` (deterministic, decays fast) ─
function shakeAt(T) {
  let x = 0, y = 0;
  for (const c of TL.cues) {
    if (!c.shake) continue;
    const dt = T - c.time; if (dt < 0) break; if (dt > 0.6) continue;
    const e = c.shake * Math.exp(-dt * 8);
    x += e * Math.sin(dt * 71 + c.time * 13); y += e * Math.cos(dt * 57 + c.time * 7);
  }
  return { x, y };
}

// ── Grain (pre-rendered once, cycled at the boil rate) ───────────────
let GRAIN = [];
